<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B7C57"/>
      <stop offset="45%" stop-color="#1E9D7C"/>
      <stop offset="100%" stop-color="#53C0A4"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="48" fill="url(#grad)"/>
  <rect width="800" height="520" rx="48" fill="white" fill-opacity="0.08" filter="url(#grain)"/>
  <g fill="white" fill-opacity="0.85">
    <text x="400" y="220" text-anchor="middle" font-family="Roboto, sans-serif" font-size="42" font-weight="600" letter-spacing="0.15em">
      PRIVATE RETREATS
    </text>
    <text x="400" y="270" text-anchor="middle" font-family="Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="0.3em">
      VIETNAM DETOX
    </text>
    <text x="400" y="330" text-anchor="middle" font-family="Roboto, sans-serif" font-size="16" font-weight="400">
      Secluded sanctuaries • Bespoke fasting journeys
    </text>
  </g>
</svg>
