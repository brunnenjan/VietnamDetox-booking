              <div className="flex items-center bg-white border border-stone-200 h-10 px-4 py-2 rounded-md shadow-sm">
                <span className="text-lg font-bold text-green-700 tracking-tight leading-tight">NAPAS</span>
              </div>
            </div>
          );

          const renderPaymentStep = () => {
            const params = new URLSearchParams(window.location.search);
            const isFailed = params.get("payment") === "failed";
            const failureReason = params.get("reason");

            const handleTryAgain = () => {
              const newUrl = window.location.pathname + "?view=payment&lang=" + lang;
              window.history.replaceState({}, "", newUrl);
              setRoute({ step: "payment", lang: lang });
              
              // Scroll to payment button after UI update
              setTimeout(() => {
                const el = document.getElementById("payment-actions");
                if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
              }, 100);
            };

            return (
              <div className="space-y-10">
                <header className="space-y-2">
                  <p className="text-[12px] uppercase tracking-[0.4em] text-stone-400">{t("step")} 5</p>
                  <h1 className="text-4xl font-bold">{t("payment")}</h1>
                  <p className="text-sm text-stone-500">{t("payment_desc")}</p>
                </header>

                {isFailed && (
                  <div className="bg-rose-50 border border-rose-100 rounded-3xl p-6 space-y-3 mb-6">
                    <div className="flex items-center gap-3 text-rose-800 font-bold text-lg">
                      <div className="bg-rose-600 text-white p-1 rounded-full scale-75">
                         <Icons.Info />
                      </div>
                      <p>{t("payment_failed")}</p>
                    </div>
                    <p className="text-sm text-stone-600 leading-relaxed pl-10">
                      {failureReason || t("payment_failed_desc")}
                    </p>
                    <div className="pl-10 pt-2">
                       <button
                         type="button"
                         onClick={handleTryAgain}
                         className="inline-flex items-center justify-center bg-rose-100 text-rose-900 px-6 py-2 rounded-full font-bold text-sm hover:bg-rose-200 transition gap-2"
                       >
                         {t("try_again")} <Icons.ChevronRight />
                       </button>
                    </div>
                  </div>
                )}

                <PriceSummary
                  context="payment"
                  pricing={pricing}
                  paymentMethod={paymentMethod}
                  stripeFee={stripeFee}
                  paymentDueNow={paymentDueNow}
                  lang={lang}
                  roomName={selectedRoomName}
                  guestsCount={selection.guests}
                  retreatName={selection.retreatName}
                  retreatDate={selection.date}
                />

              <div className="space-y-6">
                <div>
                  <p className="text-xs uppercase tracking-[0.3em] text-stone-400 font-semibold mb-4">{t("payment_method")}</p>
                  <div className={`grid grid-cols-1 gap-4 ${availablePaymentMethods.length > 1 ? "sm:grid-cols-2" : ""}`}>
                    {availablePaymentMethods.map((method) => {
                      const isDomestic = method === "onepay_domestic";
                      const isSelected = paymentMethod === method;
                      return (
                        <button
                          key={method}
                          type="button"
                          aria-pressed={isSelected}
                          disabled={paymentSubmitting}
                          onClick={() => {
                            setSelectedPaymentMethod(method);
                            setPaymentError("");
                          }}
                          className={`vdx-payment-method p-4 sm:p-5 border-2 rounded-2xl flex items-start justify-between gap-3 transition-all disabled:opacity-60 disabled:cursor-not-allowed ${isSelected ? "border-emerald-600 bg-emerald-50 ring-4 ring-emerald-600/10 shadow-lg" : "border-stone-200 bg-white hover:border-emerald-600"}`}
                        >
                          <div className="min-w-0 flex-1 text-left flex flex-col justify-center">
                            <p className="font-semibold leading-snug">{t(isDomestic ? "onepay_domestic" : "onepay_international")}</p>
                            {isDomestic ? <VietQRLogo /> : <PaymentLogos />}
                            <p className="mt-3 text-sm text-stone-600 leading-relaxed">{t(isDomestic ? "onepay_domestic_desc" : "onepay_intl_desc")}</p>
                            {isDomestic && (
                              <p className="mt-3 text-sm font-semibold text-stone-800 leading-relaxed">{t("onepay_domestic_requirement")}</p>
                            )}
                          </div>
                          <span className="shrink-0" aria-hidden="true">
                            {isDomestic ? <Icons.Building /> : <Icons.CreditCard />}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div id="payment-actions" className="bg-stone-50 rounded-3xl p-6">
                  {paymentMethod === "stripe" ? (
                    <div className="space-y-4">
                      <p className="text-sm text-stone-600 leading-relaxed">
                        {t("stripe_desc")}
                      </p>
                      <button
                        type="button"
                        onClick={handlePayment}
                        disabled={paymentSubmitting}
                        className="w-full bg-emerald-800 text-white py-4 rounded-full font-bold text-lg hover:bg-emerald-900 transition flex items-center justify-center gap-2"
                      >
                        {paymentSubmitting ? t("processing_payment") : t("pay_securely_msg").replace("{{amount}}", formatVND(paymentDueNow, lang))}
                      </button>
                    </div>
                  ) : paymentMethod === "bank_transfer" ? (
                    <div className="space-y-4">
                      <p className="text-sm text-stone-600 leading-relaxed">
                        {t("bank_transfer_desc")}
                      </p>
                      <button
                        type="button"
                        onClick={handlePayment}
                        disabled={paymentSubmitting}
                        className="w-full bg-emerald-800 text-white py-4 rounded-full font-bold text-lg hover:bg-emerald-900 transition flex items-center justify-center gap-2"
                      >
                        {paymentSubmitting ? t("processing_payment") : t("confirm_bank_transfer")} <Icons.ChevronRight />
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <button
                        type="button"
                        onClick={handlePayment}
                        disabled={paymentSubmitting}
                        className="w-full bg-emerald-800 text-white py-4 rounded-full font-bold text-lg hover:bg-emerald-900 transition flex items-center justify-center gap-2"
                      >
                        {paymentSubmitting ? t("processing_payment") : t("pay_securely_msg").replace("{{amount}}", formatVND(paymentDueNow, lang))}
                      </button>
                    </div>
                  )}
                </div>
              </div>

              {!bookingMeta.bookingId && (
                <div className="flex justify-start">
                  <button type="button" onClick={() => goToStep("health_check")} className="inline-flex items-center text-stone-500 font-semibold">
                    <Icons.ChevronLeft /> {t("back")}
                  </button>
                </div>
              )}
              {paymentError && <p className="text-sm text-rose-600 mt-4">{paymentError}</p>}
              {paymentSuccess && (
                <div className="fixed bottom-24 md:bottom-32 right-4 left-4 md:right-10 md:left-auto bg-emerald-800 text-white p-6 rounded-2xl shadow-2xl shadow-emerald-900/50 z-50 flex items-center gap-4 w-auto md:w-96 ring-4 ring-emerald-800 ring-opacity-50 transform transition-all duration-300">
                  <div className="bg-white/20 p-3 rounded-full shadow-inner">
                    <Icons.Check />
                  </div>
                  <div>
                    <p className="font-extrabold text-lg tracking-wide">{t("booking_secured")}</p>
                    <p className="text-sm text-emerald-50 font-medium mt-0.5">{t("proceeding_next")}</p>
                  </div>
                </div>
              )}
              </div>
            );
          };


          const renderScreeningStep = () => {
            const handlePrimary = () => {
              if (!depositPaid) {
                goToStep("payment");
              } else {
                goToStep("review_state");
              }
            };

            const questions = [
              t("safety_question_1"),
              t("safety_question_2"),
              t("safety_question_3"),
              t("safety_question_4"),
            ];

            return (
              <div className="space-y-8 max-w-2xl">
                <header className="space-y-3">
                  <p className="text-[12px] uppercase tracking-[0.4em] text-stone-400">{t("step")} 6</p>
                  <h1 className="text-4xl font-bold">{t("health_prep")}</h1>
                  <p className="text-stone-500">{t("almost_done")}</p>
                  <p className="text-sm text-stone-500">{t("health_prep_screening_desc")}</p>
                </header>

                {new URLSearchParams(window.location.search).get("payment") === "success" && (
                  <div className="bg-emerald-50 border border-emerald-100 rounded-3xl p-6 space-y-3 mb-8">
                    <div className="flex items-center gap-3 text-emerald-800 font-bold">
                      <div className="bg-emerald-600 text-white p-1 rounded-full scale-75">
                        <Icons.Check />
                      </div>
                      <p>✓ {t("deposit_received_msg") || "Deposit payment successful. Your booking is now reserved."}</p>
                    </div>
                    {(new URLSearchParams(window.location.search).get("txn_id") || new URLSearchParams(window.location.search).get("amount")) && (
                      <div className="text-xs text-emerald-700/80 items-center gap-6 pl-9 pt-2 border-t border-emerald-200/50 flex flex-wrap">
                        {new URLSearchParams(window.location.search).get("txn_id") && (
                          <p>
                            <span className="font-semibold uppercase tracking-wider opacity-60 mr-2">Transaction ID</span>
                            <span className="font-mono">{new URLSearchParams(window.location.search).get("txn_id")}</span>
                          </p>
                        )}
                        {new URLSearchParams(window.location.search).get("amount") && (
                          <p>
                            <span className="font-semibold uppercase tracking-wider opacity-60 mr-2">Amount Paid</span>
                            <span>{formatVND(parseInt(new URLSearchParams(window.location.search).get("amount")) / 100, lang)}</span>
                          </p>
                        )}
                      </div>
                    )}
                  </div>
                )}

                <div className="bg-stone-50 border border-stone-100 rounded-3xl p-6 space-y-3">
                  <p className="text-xs uppercase tracking-[0.3em] text-stone-400">{t("what_happens_next")}</p>
                  <ul className="space-y-2 text-sm text-stone-600 list-disc pl-4">
                    <li>{t("timeline_item_1")}</li>
                    <li>{t("timeline_item_2")}</li>
                    <li>{t("timeline_item_3")}</li>
                    <li>{t("timeline_item_4")}</li>
                    <li>{t("timeline_item_5")}</li>
                  </ul>
                </div>

                <div className="space-y-4 border border-stone-100 rounded-3xl p-6">
                  <p className="text-sm font-semibold text-stone-700">{t("quick_pre_check")}</p>
                  <p className="text-sm text-stone-500">{t("quick_pre_check_desc")}</p>
                  <div className="space-y-3">
                    {questions.map((question) => (
                      <label key={question} className="flex flex-col text-sm text-stone-600 gap-1">
                        {question}
                        <select className="border border-stone-200 rounded-2xl px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-100">
                          <option value="no">{t("no")}</option>
                          <option value="yes">{t("yes")}</option>
                        </select>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                  <button
                    type="button"
                    onClick={handlePrimary}
                    className="inline-flex items-center justify-center bg-emerald-800 text-white px-6 py-3 rounded-full font-semibold hover:bg-emerald-900"
                  >
                    {t("continue_begin_health_prep")} <Icons.ChevronRight />
                  </button>
                  <button type="button" onClick={() => goToStep("review")} className="text-sm font-semibold text-stone-500 hover:text-stone-700">
                    {t("back_to_booking")}
                  </button>
                </div>
              </div>
            );
          };

          const renderReviewStateStep = () => {
            const timeline = [
              {
                label: t("deposit_received"),
                status: depositPaid ? "done" : "pending",
                description: depositPaid ? t("status_reserved_pending") : t("awaiting_payment"),
              },
              {
                label: t("guest_1_health_prep"),
                status: screeningStatus.guest1 === "complete" ? "done" : "pending",
                description: screeningStatus.guest1 === "complete" ? t("prep_complete") : t("awaiting_prep"),
              },
            ];

            if (selection.guests === 2) {
              timeline.push({
                label: t("guest_2_health_prep"),
                status: screeningStatus.guest2 === "complete" ? "done" : "pending",
                description: screeningStatus.guest2 === "complete" ? t("prep_complete") : t("awaiting_prep"),
              });
            }

            timeline.push({
              label: t("team_confirmation"),
              status: (bookingStatus === "Payment received" || bookingStatus === "Deposit received") ? "done" : "waiting",
              description: (bookingStatus === "Payment received" || bookingStatus === "Deposit received") ? t("status_confirmed") : t("begins_after_calls"),
            });

            const statusStyles = {
              done: "bg-emerald-600 text-white",
              pending: "bg-stone-100 text-stone-600",
              waiting: "bg-stone-100 text-stone-400",
            };

            const screeningGuests = [
              {
                label: t("guest_1_health_prep"),
                status: screeningStatus.guest1,
                guestNumber: 1,
                name: `${guestDetails.guest1.firstName || t("guest")} ${guestDetails.guest1.lastName || ""}`.trim() || t("guest") + " 1",
              },
              ...(selection.guests === 2
                ? [
                    {
                      label: t("guest_2_health_prep"),
                      status: screeningStatus.guest2,
                      guestNumber: 2,
                      name: `${guestDetails.guest2.firstName || t("guest")} ${guestDetails.guest2.lastName || ""}`.trim() || t("guest") + " 2",
                    },
                  ]
                : []),
            ];

            return (
              <div className="space-y-10 max-w-2xl">
                <header className="space-y-3">
                  <p className="text-[12px] uppercase tracking-[0.4em] text-stone-400">{t("step")} 7</p>
                  <h1 className="text-4xl font-bold">{t("prep_timeline")}</h1>
                  <p className="text-stone-500">{t("prep_timeline_desc")}</p>
                </header>

                <div className="space-y-4">
                  {timeline.map((item) => (
                    <div key={item.label} className="flex items-center gap-4">
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center ${statusStyles[item.status]}`}>
                        <Icons.Check />
                      </div>
                      <div>
                        <p className="font-semibold">{item.label}</p>
                        <p className="text-sm text-stone-500">{item.description}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-stone-50 border border-stone-100 rounded-3xl p-6 space-y-2">
                  <p className="text-sm text-stone-600">{t("status_reserved_pending")}</p>
                  <p className="text-sm text-stone-600">{t("confirmation_note")}</p>
                </div>


                <div className="space-y-4">
                  {screeningGuests.map((guest) => {
                    const encodedName = encodeURIComponent(guest.name || `Guest ${guest.guestNumber}`);
                    const fallbackUrl = `?view=screening&guest=${guest.guestNumber}&booking_id=${bookingMeta.bookingId || ""}&name=${encodedName}`;
                    const url = buildHealthCheckUrl(bookingMeta.bookingId, bookingMeta.customerIds[guest.guestNumber - 1], lang) || fallbackUrl;
                    return (
                      <div key={guest.guestNumber} className="border border-stone-200 rounded-3xl p-5 space-y-3">
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="text-xs uppercase tracking-[0.3em] text-stone-400">{guest.label}</p>
                            <p className="text-sm text-stone-500">
                              {guest.status === "complete" ? t("questionnaire_call_complete") : t("awaiting_questionnaire_call")}
                            </p>
                          </div>
                          <div
                            className={`w-10 h-10 rounded-full flex items-center justify-center ${guest.status === "complete" ? "bg-emerald-100 text-emerald-700" : "bg-stone-100 text-stone-400"}`}
                          >
                            <Icons.Check />
                          </div>
                        </div>
                        <div className="flex flex-col gap-2 sm:flex-row">
                          <a
                            href={url}
                            className="vdx-action-button inline-flex items-center justify-center bg-emerald-800 text-white px-4 py-2 rounded-full font-semibold text-sm hover:bg-emerald-900"
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            {t("open_health_questionnaire")}
                          </a>
                          <button
                            type="button"
                            className="inline-flex items-center justify-center bg-white text-stone-600 border border-stone-200 px-4 py-2 rounded-full text-sm font-semibold hover:border-emerald-200"
                            onClick={() => {
                              const absoluteUrl =
                                url.startsWith("http") || url.startsWith("https")
                                  ? url
                                  : window.location.origin && window.location.origin !== "null"
                                    ? `${window.location.origin}/${url}`
                                    : url;
                              const clipboard = navigator?.clipboard?.writeText;
                              if (typeof clipboard === "function") {
                                clipboard
                                  .call(navigator.clipboard, absoluteUrl)
                                  .then(() => alert(t("link_copied")))
                                  .catch(() => alert(`${t("copy_this_link")}:\n${absoluteUrl}`));
                              } else {
                                alert(`${t("copy_this_link")}:\n${absoluteUrl}`);
                              }
                            }}
                          >
                            {t("copy_link")}
                          </button>
                        </div>
                        <p className="text-xs text-stone-500">
                          {t("share_link_description")}
                        </p>
                      </div>
                    );
                  })}
                </div>

                <div className="border border-emerald-100 bg-emerald-50 rounded-3xl p-6 space-y-2 text-left">
                  <p className="text-sm font-semibold text-stone-800">{t("included_personal_health_review_call")}</p>
                  <p className="text-sm text-stone-600">
                    {t("included_personal_health_review_call_desc")}
                  </p>
                  <button
                    type="button"
                    className="inline-flex items-center bg-emerald-800 text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-emerald-900"
                    onClick={() => alert(t("request_health_review_call_alert"))}
                  >
                    {t("request_my_health_review_call")}
                  </button>
                </div>

                <div className="flex justify-between items-center">
                  <button type="button" onClick={() => goToStep("screening")} className="inline-flex items-center text-stone-500 font-semibold">
                    <Icons.ChevronLeft /> {t("back_to_health_preparation_hub")}
                  </button>
                  <button
                    type="button"
                    disabled={!screeningsComplete}
                    onClick={() => goToStep("confirmed")}
                    className={`inline-flex items-center px-6 py-3 rounded-full font-semibold ${
                      screeningsComplete ? "bg-emerald-800 text-white hover:bg-emerald-900" : "bg-stone-200 text-stone-500 cursor-not-allowed"
                    }`}
                  >
                    {t("move_to_confirmation")} <Icons.ChevronRight />
                  </button>
                </div>
              </div>
            );
          };

          const renderConfirmedStep = () => (
            <div className="flex flex-col items-center justify-center space-y-8 py-10 text-center">
              <div className="w-20 h-20 bg-emerald-100 rounded-3xl flex items-center justify-center text-emerald-700">
                <Icons.Check />
              </div>
              <div className="space-y-3">
                <h1 className="text-4xl font-bold">{t("booking_confirmed")}</h1>
                <p className="text-stone-500 max-w-md mx-auto">
                  {t("booking_confirmed_desc")}
                </p>
              </div>
              {bookingMeta.bookingId && (
                <div className="bg-stone-50 border border-stone-100 rounded-3xl p-6 w-full max-w-md">
                  <p className="text-xs uppercase tracking-[0.3em] text-stone-400 mb-2">{t("booking_ref")}</p>
                  <p className="text-2xl font-mono font-bold text-stone-800">#{bookingMeta.bookingId}</p>
                </div>
              )}
              <PriceSummary context="confirmed" pricing={pricing} lang={lang} roomName={selectedRoomName} guestsCount={selection.guests} retreatName={selection.retreatName} retreatDate={selection.date} />
              <button
                type="button"
                onClick={() => (window.location.href = "/")}
                className="inline-flex items-center bg-stone-900 text-white px-8 py-4 rounded-full font-bold hover:bg-stone-800 transition"
              >
                {t("return_home")}
              </button>
            </div>
          );
          const stepConfig = {
            config: { content: renderConfigStep(), summaryContext: "default" },
            details: { content: renderGuestDetailsStep(), summaryContext: "default" },
            review: { content: renderReviewStep(), summaryContext: "review" },
            health_check: { content: renderHealthPreparationStep(), summaryContext: "default" },
            payment: { content: renderPaymentStep(), summaryContext: "payment" },
            screening: { content: renderScreeningStep(), summaryContext: "default" },
            review_state: { content: renderReviewStateStep(), summaryContext: "default" },
            confirmed: { content: renderConfirmedStep(), summaryContext: "confirmed" },
          };

          const stepEntry = stepConfig[flowStep] || stepConfig.config;
          const { content, summaryContext } = stepEntry;

          if (recoveryLoading) {
            return (
              <div id="booking-app-wrapper" className="min-h-screen bg-stone-50 flex items-center justify-center p-6">
                <div className="text-center space-y-4">
                  <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-stone-800 mx-auto"></div>
                  <p className="text-stone-500 font-medium">Restoring your booking session...</p>
                </div>
              </div>
            );
          }

          return (
            <div id="booking-app-wrapper" className="min-h-screen bg-brand-ivory font-sans text-stone-900 selection:bg-emerald-100 relative">

              {(isTransitioning) && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-white/60 backdrop-blur-[2px] transition-all duration-300">
                  <div className="w-14 h-14 bg-white rounded-full shadow-2xl flex items-center justify-center border border-stone-100">
                    <div className="w-6 h-6 border-[3px] border-emerald-600 border-t-transparent animate-spin rounded-full"></div>
                  </div>
                </div>
              )}

              <div className={`transition-opacity duration-500 ease-in-out ${isTransitioning ? "opacity-30 pointer-events-none" : "opacity-100"}`}>
                <main className="max-w-6xl mx-auto px-6 py-12 space-y-8">
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-12">
                  <div className={`${["payment", "confirmed"].includes(flowStep) ? "lg:col-span-3 max-w-4xl mx-auto w-full" : "lg:col-span-2"} space-y-10`}>
                    {content}
                  </div>
                  {!["payment", "confirmed"].includes(flowStep) && (
                    <div className="hidden lg:block lg:col-span-1">
                      <div className="sticky top-24">
                        <PriceSummary
                          context={summaryContext}
                          pricing={pricing}
                          paymentMethod={paymentMethod}
                          stripeFee={stripeFee}
                          paymentDueNow={paymentDueNow}
                          lang={lang}
                          roomName={selectedRoomName}
                          guestsCount={selection.guests}
                          retreatName={selection.retreatName}
                          retreatDate={selection.date}
                        />
                      </div>
                    </div>
                  )}
                </div>
                {!["payment", "confirmed"].includes(flowStep) && (
                  <div className="lg:hidden">
                    <PriceSummary
                      context={summaryContext}
                      pricing={pricing}
                      paymentMethod={paymentMethod}
                      stripeFee={stripeFee}
                      paymentDueNow={paymentDueNow}
                      lang={lang}
                      roomName={selectedRoomName}
                      guestsCount={selection.guests}
                      retreatName={selection.retreatName}
                      retreatDate={selection.date}
                    />
                  </div>
                )}
              </main>
            </div>
              {galleryRoom && (
                <div
                  className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-4"
                  onClick={(event) => {
                    if (event.target === event.currentTarget) {
                      closeGallery();
                    }
                  }}
                >
                  <div
                    ref={modalRef}
                    role="dialog"
                    aria-modal="true"
                    aria-label={`${galleryRoom.name} gallery`}
                    className="relative max-w-3xl w-full bg-white rounded-3xl overflow-hidden shadow-2xl outline-none"
                    onClick={(e) => e.stopPropagation()}
                    tabIndex={-1}
                  >
                    <button
                      type="button"
                      ref={closeButtonRef}
                      aria-label="Close gallery"
                      className="vdx-icon-button absolute top-4 right-4 text-stone-900 bg-white/70 hover:bg-white rounded-full w-10 h-10 flex items-center justify-center text-xl"
                      onClick={closeGallery}
                    >
                      <span aria-hidden="true">&times;</span>
                    </button>
                    <div className="relative">
                      <img
                        src={galleryRoom.images[galleryIndex]}
                        alt={galleryRoom.name}
                        className="w-full h-[420px] object-cover"
                        onError={handleImageError}
                      />
                      {galleryRoom.images.length > 1 && (
                        <>
                          <button
                            type="button"
                            className="vdx-icon-button absolute left-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-stone-900 rounded-full p-2"
                            onClick={showPrevImage}
                            aria-label="Previous image"
                          >
                            ‹
                          </button>
                          <button
                            type="button"
                            className="vdx-icon-button absolute right-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-stone-900 rounded-full p-2"
                            onClick={showNextImage}
                            aria-label="Next image"
                          >
                            ›
                          </button>
                        </>
                      )}
                    </div>
                    <div className="p-6 space-y-1">
                      <p className="text-xs uppercase tracking-[0.3em] text-stone-400">Gallery</p>
                      <h3 className="text-2xl font-bold">{galleryRoom.name}</h3>
                      <p className="text-sm text-stone-500">{galleryRoom.benefit}</p>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        };

        class AppErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false };
            this.handleReset = this.handleReset.bind(this);
          }

          static getDerivedStateFromError(error) {
            return { hasError: true, error };
          }

          componentDidCatch(error, info) {
            console.error("Booking UI error", error, info);
          }

          handleReset() {
            this.setState({ hasError: false, error: null });
            if (typeof this.props.onReset === "function") {
              this.props.onReset();
            }
          }

          render() {
            if (this.state.hasError) {
              const lang = parseRouteFromLocation().lang || getInitialLang();
              const t = (key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS.en[key] || key;
              return (
                <div id="booking-app-wrapper" className="min-h-screen bg-brand-ivory font-sans text-stone-900 selection:bg-emerald-100 flex items-center justify-center px-6">
                  <div className="max-w-md text-center space-y-4">
                    <p className="text-[12px] uppercase tracking-[0.4em] text-stone-400">{t("booking_progress")}</p>
                    <h1 className="text-3xl font-bold text-stone-900">{t("something_went_wrong")}</h1>
                    <p className="text-stone-600">{t("error_desc")}</p>
                    <button
                      type="button"
                      onClick={this.handleReset}
                      className="inline-flex items-center justify-center bg-emerald-800 text-white px-6 py-3 rounded-full font-semibold hover:bg-emerald-900"
                    >
                      {t("refresh_page")}
                    </button>
                  </div>
                </div>
              );

            }
            return this.props.children;
          }

        }

        const RootApp = () => {
          const [resetKey, setResetKey] = useState(0);
          const handleReset = () => setResetKey((key) => key + 1);
          return (
            <AppErrorBoundary onReset={handleReset}>
              <App key={resetKey} />
            </AppErrorBoundary>
          );
        };

        if (!bookingRoot) {
          bookingRoot = ReactDOM.createRoot(rootNode);
        }
        bookingRoot.render(<RootApp />);
      };

      const bootBookingApp = async () => {
        if (window.__bookingAppBooted) return;
        window.__bookingAppBooted = true;
        try {
          const rootNode = document.getElementById("root");
          if (rootNode) {
            rootNode.innerHTML = `
              <div id="booking-app-wrapper" class="min-h-[50vh] flex flex-col items-center justify-center space-y-4">
                <div class="w-8 h-8 border-[3px] border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-[10px] font-bold uppercase tracking-[0.25em] text-stone-400">Loading Retreats</p>
              </div>
            `;
          }
          const retreatsLoaded = await fetchRetreats();
          if (!retreatsLoaded) {
            showInlineError("Unable to load retreat options. Please try again.", { retry: true });
            return;
          }
          startBookingApp();
        } catch (error) {
          console.error("Booking app failed during init", error);
          showInlineError("We were unable to load the booking experience. Please try again.", { retry: true });
        }
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootBookingApp);
      } else {
        bootBookingApp();
      }
    </script>
  </body>
</html>
