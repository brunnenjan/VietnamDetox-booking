    <style>

         VIETNAM DETOX 2026 DESIGN SYSTEM
         Shared visual foundation for every step of the booking flow.
         --------------------------------------------------------------- */

      #booking-app-wrapper *::after {

  <body class="bg-brand-ivory">
    <script>
      if (document.querySelector(".elementor-location-header")) {
        document.body.classList.add("vdx-elementor-embed");
      }
    </script>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      /** @jsxRuntime classic */
      const FALLBACK_IMAGE = "/wp-content/uploads/2024/11/retreat-placeholder.webp";
      let bookingRoot = null;

      const getInitialLang = () => {
        const docLang = document.documentElement.lang?.toLowerCase() || "";
        if (docLang.startsWith("vi")) return "vn";
        if (docLang.startsWith("de")) return "de";
        
        const path = window.location.pathname.toLowerCase();
        if (path.includes("dang-ky")) return "vn";
        if (path.includes("/de/")) return "de";
        
        return "en";
      };

      const normalizeLang = (value) => {
        const normalized = String(value || "").toLowerCase();
        if (normalized === "vi") return "vn";
        return ["en", "vn", "de"].includes(normalized) ? normalized : getInitialLang();
      };

      const normalizeBookingReturnPath = (value) => {
        if (!value) return "";
        try {
          const path = new URL(value, window.location.origin).pathname;
          const normalizedPath = `/${path.replace(/^\/+|\/+$/g, "")}/`;
          return ["/booking/", "/vi/dat-cho/", "/de/booking-flow/"].includes(normalizedPath)
            ? normalizedPath
            : "";
        } catch (error) {
          return "";
        }
      };

      const getDefaultBookingReturnPath = (lang) => {
        const normalizedLang = normalizeLang(lang);
        if (normalizedLang === "vn") return "/vi/dat-cho/";
        if (normalizedLang === "de") return "/de/booking-flow/";
        return "/booking/";
      };

      const getBookingReturnPath = (lang = getInitialLang()) => {
        const fallbackPath = getDefaultBookingReturnPath(lang);

        // Elementor normally runs the app inline. If it is placed in a
        // same-origin frame, use the parent page rather than the frame URL.
        if (window.top === window) {
          return normalizeBookingReturnPath(window.location.href) || fallbackPath;
        }

        const candidates = [];
        try {
          candidates.push(window.top.location.href);
        } catch (error) {
          // A cross-origin parent cannot be inspected; document.referrer is
          // the safe fallback in that case.
        }
        candidates.push(document.referrer, window.location.href);

        for (const candidate of candidates) {
          const path = normalizeBookingReturnPath(candidate);
          if (path) return path;
        }

        return fallbackPath;
      };

      const showInlineError = (message, options = {}) => {
        const { retry = false } = options;
        const container = document.getElementById("root");
        if (!container) return;
        container.innerHTML = "";
        const wrapper = document.createElement("div");
        wrapper.id = "booking-app-wrapper";
        wrapper.style.padding = "48px 24px";
        wrapper.style.fontFamily = '"Be Vietnam Pro", system-ui, sans-serif';
        wrapper.style.maxWidth = "560px";
        wrapper.style.margin = "64px auto";
        wrapper.style.textAlign = "center";
        const heading = document.createElement("h2");
        heading.textContent = "We hit a snag";
        heading.style.marginBottom = "12px";
        heading.style.color = "#1c1c18";
        const body = document.createElement("p");
        body.textContent = message || "Please try again in a moment.";
        body.style.color = "#8a8070";
        body.style.marginBottom = retry ? "20px" : "0";
        wrapper.appendChild(heading);
        wrapper.appendChild(body);
        if (retry) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Try again";
          button.style.background = "#e06420";
          button.style.color = "#fff";
          button.style.border = "none";
          button.style.padding = "12px 24px";
          button.style.borderRadius = "8px";
          button.style.fontWeight = "600";
          button.style.letterSpacing = "0.12em";
          button.style.textTransform = "uppercase";
          button.style.cursor = "pointer";
          button.addEventListener("click", () => {
            button.disabled = true;
            button.textContent = "Reconnecting…";
            bootBookingApp();
          });
          wrapper.appendChild(button);
        }
        container.appendChild(wrapper);
      };

      const handleImageError = (event) => {
        const target = event?.target;
        if (!target || target.dataset?.fallbackApplied === "true") return;
        target.src = FALLBACK_IMAGE;
        target.setAttribute("data-fallback-applied", "true");
        target.alt = target.alt ? `${target.alt} unavailable` : "Image unavailable";
      };

      let RETREATS = [];
      let TRANSPORT_BY_RETREAT = {};
      let ROOMS_BY_RETREAT = [];

      const fetchRetreats = async (overrideLang = null) => {
        try {
          const params = new URLSearchParams(window.location.search || "");
          const langParam = normalizeLang(
            overrideLang || params.get("booking_lang") || params.get("lang") || getInitialLang()
          );
          const response = await fetch(`/wp-json/retreats/v1/all?lang=${langParam}&context=booking`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const rawRetreats = await response.json();
          if (!Array.isArray(rawRetreats) || rawRetreats.length === 0) {
            throw new Error("Empty retreat response");
          }

          const buildRoomBenefit = (pkg) => {
            if (pkg.roomType) return pkg.roomType;
            if (pkg.type) return pkg.type;
            if (pkg.person) return pkg.person > 1 ? `Shared for ${pkg.person}` : "Solo retreat";
            return "Retreat package";
          };

          RETREATS = rawRetreats.map((retreat) => {
            const packages = Array.isArray(retreat.packages) ? retreat.packages : [];
            const transportations = Array.isArray(retreat.transportations) ? retreat.transportations : [];
            const normalizedPackages = packages.map((pkg, index) => {
              const sku = pkg.sku || null;
              return {
                ...pkg,
                id: sku || `pkg-${retreat.id}-${index}`,
                sku,
                images: Array.isArray(pkg.images) && pkg.images.length > 0 ? pkg.images : [FALLBACK_IMAGE],
                benefit: buildRoomBenefit(pkg),
              };
            });

            TRANSPORT_BY_RETREAT[retreat.id] = transportations;
            ROOMS_BY_RETREAT[retreat.id] = normalizedPackages;
            return retreat;
          });

          return RETREATS.length > 0;
        } catch (error) {
          console.error("Failed to fetch retreats:", error);
          return false;
        }
      };

        const PHONE_COUNTRY_BY_ISO = Object.fromEntries(PHONE_COUNTRIES.map((country) => [country.iso, country]));

        const parseRouteFromLocation = () => {

            stepParam = "payment";

          if (!STEPS.includes(stepParam)) {
            stepParam = "config";

          const langParam = normalizeLang(

        const getRoomsForRetreat = (retreatId) => ROOMS_BY_RETREAT[retreatId] || [];
        const getTransportOptionsForRetreat = (retreatId) => TRANSPORT_BY_RETREAT[retreatId] || [];

        const intlLocaleFor = (lang) => (lang === "vn" ? "vi" : lang === "de" ? "de" : "en");
        const regionNamesByLocale = {};
        const getCountryName = (iso, lang) => {
          const locale = intlLocaleFor(lang);
          try {
            regionNamesByLocale[locale] = regionNamesByLocale[locale] || new Intl.DisplayNames([locale], { type: "region" });
            const name = regionNamesByLocale[locale].of(iso);
            if (name && name !== iso) return name;
          } catch (error) {
            // Older browsers without Intl.DisplayNames use the English list.
          }
          return PHONE_COUNTRY_BY_ISO[iso]?.name || iso;
        };

        // Lower case, without accents (đ → d), so "Việt Nam" matches "viet nam".
        const normalizeCountryText = (value) =>
          String(value || "").replace(/[đĐ]/g, "d").normalize("NFD").replace(/[̀-ͯ]/g, "")
            .toLowerCase().replace(/[^a-z0-9+]+/g, " ").trim();

        const COUNTRY_NAME_ALIASES = {

          "northern ireland": "GB", britain: "GB", "great britain": "GB", "viet nam": "VN", korea: "KR", "republic of korea": "KR",
          "czech republic": "CZ", holland: "NL", turkey: "TR", uae: "AE", "russian federation": "RU", macau: "MO",
          "ivory coast": "CI", burma: "MM", swaziland: "SZ", "east timor": "TL", macedonia: "MK", vatican: "VA",
          deutschland: "DE", osterreich: "AT", schweiz: "CH",
        };
        let countryNameLookup = null;
        /** Country of residence text → ISO code, in English, Vietnamese or German. */
        const findCountryIso = (text) => {
          const key = normalizeCountryText(text);
          if (!key) return null;
          if (!countryNameLookup) {
            countryNameLookup = { ...COUNTRY_NAME_ALIASES };
            PHONE_COUNTRIES.forEach((country) => {
              countryNameLookup[normalizeCountryText(country.name)] = country.iso;
              ["en", "vn", "de"].forEach((lang) => {
                countryNameLookup[normalizeCountryText(getCountryName(country.iso, lang))] = country.iso;
              });

          }
          return countryNameLookup[key] || null;

        const getDialCode = (iso) => PHONE_COUNTRY_BY_ISO[iso]?.dial || "";
        const countryForDial = (dial) =>
          MAIN_COUNTRY_FOR_DIAL[dial] || PHONE_COUNTRIES.find((country) => country.dial === dial)?.iso || DEFAULT_PHONE_COUNTRY;
        // The picker stores the country; states saved before it only have the dial code.
        const getGuestPhoneCountry = (guest) =>
          (guest?.phoneCountry && PHONE_COUNTRY_BY_ISO[guest.phoneCountry]) ? guest.phoneCountry : countryForDial(guest?.phoneCountryCode);

        /** "+49 151…" or "0049 151…" → the guest with that country selected and only the national number left. */
        const withSplitPhone = (guest) => {
          const match = String(guest?.phone || "").trim().match(/^(?:\+|00)\s*(\d[\d\s().-]*)$/);
          if (!match) return guest;
          const digits = match[1].replace(/\D/g, "");
          const country = PHONE_COUNTRIES.reduce((best, item) =>
            digits.startsWith(item.dial.slice(1)) && (!best || item.dial.length > best.dial.length) ? item : best, null);
          if (!country) return guest;
          let index = 0;
          for (let skip = country.dial.length - 1; index < match[1].length && skip > 0; index += 1) {
            if (/\d/.test(match[1][index])) skip -= 1;
          }
          // Keep a chosen country that shares the dial code (e.g. Jersey on +44).
          const current = getGuestPhoneCountry(guest);
          const iso = getDialCode(current) === country.dial ? current : countryForDial(country.dial);
          return { ...guest, phone: match[1].slice(index).replace(/^[\s.-]+/, ""), phoneCountry: iso, phoneCountryCode: country.dial, phoneCodeManuallySet: true };
        };

        const formatPhoneWithCountry = (guest) => {
          const phone = String(guest?.phone || "").trim();
          if (!phone) return "";
          if (/^(\+|00)/.test(phone)) return phone.replace(/^00/, "+");
          const dial = getDialCode(getGuestPhoneCountry(guest));
          // Most countries drop the leading trunk 0 after the dial code; Italy, the Vatican and San Marino keep it.
          return `${dial} ${["+39", "+378"].includes(dial) ? phone : phone.replace(/^0(?=\d)/, "")}`;

            const pixels = context.getImageData(0, 0, 20, 20).data;

              if (pixels[i + 3] && (pixels[i] !== pixels[i + 1] || pixels[i + 1] !== pixels[i + 2])) return;

            const collator = new Intl.Collator(intlLocaleFor(lang));

              .sort((a, b) => collator.compare(a.label, b.label));

          const results = useMemo(() => {
            const term = normalizeCountryText(query);

            if (/^\+?\d+$/.test(term.replace(/\s/g, ""))) {
              const digits = term.replace(/\D/g, "");
              return countries.filter((country) => country.dial.slice(1).startsWith(digits));
            }
            return countries.filter((country) =>
              normalizeCountryText(country.label).includes(term) || normalizeCountryText(country.name).includes(term)
              || country.iso.toLowerCase() === term);

            if (!open) return undefined;

            setActive(Math.max(0, countries.findIndex((country) => country.iso === selected.iso)));

              event.preventDefault();
              setActive((index) => Math.max(0, index - 1));

              event.preventDefault();
              if (results[active]) choose(results[active]);

              event.preventDefault();

                        onMouseEnter={() => setActive(index)}
                        className={`flex items-center gap-3 px-4 py-2 text-sm cursor-pointer ${index === active ? "bg-emerald-50" : ""} ${country.iso === selected.iso ? "font-semibold text-emerald-900" : "text-stone-700"}`}

                        <span className="text-stone-400 tabular-nums">{country.dial}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        };

          const PriceSummary = ({ context = "default", pricing, paymentMethod, stripeFee, paymentDueNow, lang, roomName, guestsCount, retreatName, retreatDate }) => {
            const t = (key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS.en[key] || key;


            const showEarlyBird = pricing.earlyBird > 0;
            const showFriend = pricing.friend > 0;
            const showDepositLine = context === "review" || context === "payment";
            const showReviewNote = context === "review";
            const depositLabel = context === "payment" ? t("deposit_due_label") : t("deposit_label");
            return (
              <div className="bg-white border border-stone-100 rounded-3xl p-6 shadow-sm space-y-4">
                <div>
                  <p className="text-xs uppercase tracking-[0.3em] text-stone-400 font-semibold mb-4">{t("investment_summary")}</p>
                  
                  <div className="space-y-4 mb-4">
                    {retreatName && (
                      <div>
                        <p className="text-[10px] uppercase tracking-[0.2em] text-stone-400 mb-1">{t("retreat")}</p>
                        <p className="text-base font-semibold text-stone-900 leading-tight" title={retreatName}>{retreatName}</p>
                      </div>
                    )}
                    {retreatDate && (
                      <div>
                        <p className="text-[10px] uppercase tracking-[0.2em] text-stone-400 mb-1">{t("retreat_dates")}</p>
                        <p className="text-sm font-medium text-stone-700 leading-tight" title={retreatDate}>{retreatDate}</p>
                      </div>
                    )}
                  </div>
                  
                  <p className="text-sm text-stone-500 pt-3 border-t border-stone-100">{t("real_time_update")}</p>
                </div>
                <div className="space-y-2 text-sm">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <p className="font-semibold text-stone-900">{roomName || t("accommodation")}</p>
                      <p className="text-xs text-stone-500">{guestsCount === 2 ? t("two_guests") : t("one_guest")}</p>
                    </div>
                    <span className="font-semibold whitespace-nowrap">{formatVND(pricing.subtotal, lang)}</span>
                  </div>
                  {showEarlyBird && (
                    <div className="flex justify-between text-emerald-700">
                      <span>{t("early_bird_discount").replace("{{discount}}", formatConfiguredDiscount(pricing.earlyBirdConfig, lang))}</span>
                      <span>-{formatVND(pricing.earlyBird, lang)}</span>
                    </div>
                  )}
                  {showFriend && (
                    <div className="flex justify-between text-emerald-700">
                      <span>{t("save_together").replace("{{discount}}", formatConfiguredDiscount(pricing.friendConfig, lang))}</span>
                      <span>-{formatVND(pricing.friend, lang)}</span>
                    </div>
                  )}
                  <div className="flex justify-between text-stone-500">
                    <span>{t("airport_transfer").replace(" (optional)", "")}</span>
                    <span>{formatVND(pricing.transport, lang)}</span>
                  </div>
                </div>
                <div className="flex justify-between pt-2 border-t border-stone-100">
                  <span className="text-stone-500">{t("retreat_total")}</span>
                  <span className="text-2xl font-bold">{formatVND(pricing.total, lang)}</span>
                </div>
                {showDepositLine && (
                  <>
                    <div className="flex justify-between">
                      <span className="text-stone-500">{depositLabel}</span>
                      <span className="font-semibold">{formatVND(pricing.deposit, lang)}</span>
                    </div>
                    <div className="flex justify-between text-sm text-stone-500">
                      <span>{t("remaining_balance")}</span>
                      <span className="font-semibold">{formatVND(pricing.remaining, lang)}</span>
                    </div>
                  </>
                )}
                <p className="text-sm text-stone-500">{formatUSD(pricing.total, lang)}</p>
                {showReviewNote && (
                  <p className="text-sm text-stone-600">
                    {t("refund_note")}
                  </p>
                )}
                {context === "payment" && (
                  <div className="pt-2 border-t border-stone-100 space-y-2">
                    {paymentMethod === "stripe" && stripeFee > 0 && (
                      <div className="flex justify-between text-amber-700">
                        <span>{t("card_fee")}</span>
                        <span>{formatVND(stripeFee, lang)}</span>
                      </div>
                    )}
                    <div className="flex justify-between">
                      <span className="text-stone-500">{t("due_today")}</span>
                      <span className="text-xl font-bold">{formatVND(paymentDueNow, lang)}</span>
                    </div>
                    <p className="text-sm text-stone-500">{formatUSD(paymentDueNow, lang)}</p>
                  </div>
                )}
                {context === "confirmed" && <p className="text-sm text-emerald-700">{t("deposit_received_msg")}</p>}
              </div>
            );
          };


        // Constants will be defined inside App to ensure RETREATS is loaded

        const buildHealthCheckUrl = (bookingId, customerId, lang = "en") => {
          if (!bookingId || !customerId) return "";
          const params = new URLSearchParams({
            reg_id: bookingId,
            cus_id: customerId,
          });
          const baseUrl = HEALTHCHECK_URLS[lang] || HEALTHCHECK_URLS.en;
          return `${baseUrl}?${params.toString()}`;
        };

        const parseRetreatStartDate = (value) => {
          if (!value) return null;
          const dateOnlyMatch = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
          const parsed = dateOnlyMatch
            ? new Date(Number(dateOnlyMatch[1]), Number(dateOnlyMatch[2]) - 1, Number(dateOnlyMatch[3]))
            : new Date(value);
          if (Number.isNaN(parsed.getTime())) return null;
          parsed.setHours(0, 0, 0, 0);
          return parsed;
        };

        const isRetreatDateAvailable = (date) => {
          const startDate = parseRetreatStartDate(date?.start);
          if (!startDate) return false;
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          return startDate >= today;
        };

        const getRetreatDateKey = (value) => {
          const date = parseRetreatStartDate(value);
          if (!date) return "";
          const month = String(date.getMonth() + 1).padStart(2, "0");
          const day = String(date.getDate()).padStart(2, "0");
          return `${date.getFullYear()}-${month}-${day}`;
        };

        const getRequestedBookingRetreat = (params) => {
          const requestedRetreatId = Number.parseInt(params.get("retreat_id") || "", 10);
          const requestedPackageSku = String(params.get("package_sku") || "").trim();

          let retreat = Number.isInteger(requestedRetreatId)
            ? RETREATS.find((item) => Number(item.id) === requestedRetreatId)
            : null;

          // A package-only link can still identify its owning retreat, while
          // retreat_id remains authoritative when both parameters are present.
          if (!retreat && !Number.isInteger(requestedRetreatId) && requestedPackageSku) {
            retreat = RETREATS.find((item) =>
              getRoomsForRetreat(item.id).some(
                (room) => String(room.sku || "").toLowerCase() === requestedPackageSku.toLowerCase(),
              ),
            );
          }

          return (Array.isArray(retreat?.dates) ? retreat.dates : []).some(isRetreatDateAvailable)
            ? retreat
            : null;
        };

        const getBookingRetreats = () => {
          const requestedRetreat = getRequestedBookingRetreat(
            new URLSearchParams(window.location.search || ""),
          );
          const retreats = RETREATS.filter((retreat) =>
            (Array.isArray(retreat.dates) ? retreat.dates : []).some(isRetreatDateAvailable),
          );

          // A link from a retreat page shows only that retreat, so another one cannot be
          // chosen by accident. Opening the booking page directly lists all retreats in API order.
          return requestedRetreat ? [requestedRetreat] : retreats;
        };

        const getInitialBookingSelection = (defaultRetreat) => {
          const params = new URLSearchParams(window.location.search || "");
          const requestedPackageSku = String(params.get("package_sku") || "").trim();
          const requestedStartDate = getRetreatDateKey(params.get("start_date"));
          const retreat = getRequestedBookingRetreat(params) || defaultRetreat;

          const availableDates = (Array.isArray(retreat?.dates) ? retreat.dates : [])
            .filter(isRetreatDateAvailable);
          const selectedDate = availableDates.find(
            (date) => requestedStartDate && getRetreatDateKey(date.start) === requestedStartDate,
          ) || availableDates[0] || { label: "" };

          const packages = getRoomsForRetreat(retreat.id);
          const selectedPackage = packages.find(
            (room) => requestedPackageSku && String(room.sku || "").toLowerCase() === requestedPackageSku.toLowerCase(),
          ) || packages[0] || null;
          const packageGuestCount = Number(selectedPackage?.person);
          const guests = packageGuestCount === 2 ? 2 : 1;

          return {
            retreatId: retreat.id,
            retreatName: retreat.name,
            retreatLocation: retreat.location,
            retreatEarlyBirdNote: retreat.earlyBirdNote,
            retreatImage: retreat.image || FALLBACK_IMAGE,
            date: selectedDate.label,
            guests,
            roomType: selectedPackage?.id || null,
            transfer: getTransportOptionsForRetreat(retreat.id)?.[0]?.id ?? null,
          };
        };

        const App = () => {
          const DEFAULT_RETREAT = RETREATS.find((retreat) =>
            (Array.isArray(retreat.dates) ? retreat.dates : []).some(isRetreatDateAvailable)
          ) || { id: 0, dates: [], image: FALLBACK_IMAGE };
          const DEFAULT_PHONE_CODE = getDialCode(DEFAULT_PHONE_COUNTRY);

          const [route, setRoute] = useState(parseRouteFromLocation);
          const [isTransitioning, setIsTransitioning] = useState(false);

          useEffect(() => {
            const rootNode = document.getElementById("root");
            if (rootNode) {
              rootNode.querySelectorAll('button').forEach(btn => {
                if (!btn.getAttribute('type')) {
                  btn.setAttribute('type', 'button');
                }
              });
            }
          });

          const [savedState] = useState(() => {
            const params = new URLSearchParams(window.location.search || "");
            const paymentStatus = params.get("payment");
            if (paymentStatus === "success" || paymentStatus === "failed") {
              try {
                const raw = sessionStorage.getItem("vdx_booking_state");
                if (raw) return JSON.parse(raw);
              } catch(e) {}
            }
            return null;
          });

          const initialBookingSelection = getInitialBookingSelection(DEFAULT_RETREAT);

          const [selection, setSelection] = useState(() => savedState?.selection || initialBookingSelection);
          const [guestDetails, setGuestDetails] = useState(() => savedState?.guestDetails || ({
            guest1: {
              gender: "",
              firstName: "",
              lastName: "",
              email: "",
              phone: "",
              phoneCountry: DEFAULT_PHONE_COUNTRY,
              phoneCountryCode: DEFAULT_PHONE_CODE,
              phoneCodeManuallySet: false,
              street: "",
              city: "",
              postalCode: "",
              country: "",
              needsCompanyInvoice: false,
              companyName: "",
              taxId: "",
              companyPhone: "",
              companyAddress: "",
            },
            guest2: {
              gender: "", firstName: "", lastName: "", email: "", phone: "",
              phoneCountry: DEFAULT_PHONE_COUNTRY, phoneCountryCode: DEFAULT_PHONE_CODE, phoneCodeManuallySet: false,
            },
          }));
          const [paymentSubmitting, setPaymentSubmitting] = useState(false);
          const [paymentError, setPaymentError] = useState("");
          const [paymentSuccess, setPaymentSuccess] = useState(false);
          const [galleryRoom, setGalleryRoom] = useState(null);
          const [galleryIndex, setGalleryIndex] = useState(0);
          const [depositPaid, setDepositPaid] = useState(() => {
            const params = new URLSearchParams(window.location.search || "");
            if (params.get("payment") === "success") return true; 
            if (params.get("payment") === "failed") return false;
            return savedState ? true : false;
          });

          const [bookingMeta, setBookingMeta] = useState(() => {
            if (savedState?.bookingMeta) return savedState.bookingMeta;
            const params = new URLSearchParams(window.location.search || "");
            const bId = params.get("booking_id");
            if (bId) return { bookingId: parseInt(bId), customerIds: [] };
            return { bookingId: null, customerIds: [] };
          });
          const [bookingStatus, setBookingStatus] = useState("");
          const [screeningStatus, setScreeningStatus] = useState(() => savedState?.screeningStatus || { guest1: "pending", guest2: (savedState?.selection?.guests || 1) === 2 ? "pending" : "not_required" });
          const [safetyAnswers, setSafetyAnswers] = useState({
            underweight: "",
            liverKidney: "",
            pregnancy: "",
            cardio: "",
          });
          const modalRef = useRef(null);
          const closeButtonRef = useRef(null);
          const scrollLockRef = useRef({ top: 0, previousFocus: null });
          const initialRouteRef = useRef(route);

          const routeStep = route?.step;
          const flowStep = STEPS.includes(routeStep) ? routeStep : "config";
          const lang = route?.lang || getInitialLang();
          const availablePaymentMethods = lang === "en"
            ? ["onepay_intl", "onepay_domestic"]
            : [lang === "vn" ? "onepay_domestic" : "onepay_intl"];
          const [selectedPaymentMethod, setSelectedPaymentMethod] = useState(() => savedState?.paymentMethod || null);
          const paymentMethod = availablePaymentMethods.includes(selectedPaymentMethod)
            ? selectedPaymentMethod
            : availablePaymentMethods[0];
          const emailGuestDetails = Object.fromEntries(
            Object.entries(guestDetails).map(([guestKey, guest]) => [
              guestKey,
              {
                ...guest,
                // The API stores this field as is, so it carries the selected dial code.
                phone: formatPhoneWithCountry(guest),
                emailLanguage: guest.emailLanguage || (lang === "vn" ? "vi" : "en"),
              },
            ]),
          );

          const [recoveryLoading, setRecoveryLoading] = useState(!!route.recoveryId);

          useEffect(() => {
            if (route.recoveryId && route.recoveryToken) {
              const fetchRecovery = async () => {
                try {
                  const response = await fetch(`/wp-json/retreats/v1/registration-recovery/${route.recoveryId}?token=${route.recoveryToken}`);
                  if (response.ok) {
                    const data = await response.json();
                    if (data.selection) {
                      const r = RETREATS.find(ret => ret.id === data.selection.retreatId);
                      const rooms = r ? (ROOMS_BY_RETREAT[r.id] || []) : [];
                      
                      // Better room matching logic
                      let recoveredRoomId = data.selection.roomType;
                      if (recoveredRoomId) {
                        const directMatch = rooms.find(rm => rm.id === recoveredRoomId);
                        if (!directMatch) {
                          // Fallback: match by SKU if the ID was a legacy "SKU-index" format
                          const recoveredSku = recoveredRoomId.split(/[-_]/)[0];
                          const skuMatch = rooms.find(rm => rm.sku === recoveredSku || rm.id === recoveredSku);
                          if (skuMatch) {
                            recoveredRoomId = skuMatch.id;
                          }
                        }
                      }

                      setSelection(prev => ({ 
                        ...prev, 
                        ...data.selection,
                        roomType: recoveredRoomId || data.selection.roomType,
                        retreatImage: r?.image || prev.retreatImage,
                        retreatEarlyBirdNote: r?.earlyBirdNote || prev.retreatEarlyBirdNote
                      }));
                    }
                    if (data.guestDetails) {
                      setGuestDetails(prev => ({
                        guest1: withSplitPhone({ ...prev.guest1, ...data.guestDetails.guest1 }),
                        guest2: withSplitPhone({ ...prev.guest2, ...data.guestDetails.guest2 }),
                      }));
                    }
                    if (data.bookingMeta) {
                      setBookingMeta(data.bookingMeta);
                    }
                    // Jump to Review/Payment step
                    setRoute(prev => ({ ...prev, step: "payment", recoveryId: null, recoveryToken: null }));
                  }
                } catch (err) {
                  console.error("Recovery failed", err);
                } finally {
                  setRecoveryLoading(false);
                }
              };
              fetchRecovery();
            }
          }, [route.recoveryId, route.recoveryToken]);

          useEffect(() => {
            if (!bookingMeta.bookingId) return;
            
            const fetchStatus = async () => {
              try {
                const response = await fetch(`/wp-json/retreats/v1/registration-status/${bookingMeta.bookingId}`);
                if (response.ok) {
                  const data = await response.json();
                  setBookingStatus(data.status);
                  
                  const isPaid = data.status === "Deposit received" || data.status === "Payment received";
                  if (isPaid) setDepositPaid(true);

                  setBookingMeta(prev => ({
                    ...prev,
                    customerIds: data.customer_ids || []
                  }));

                  const isDone = (hc) => hc === "yes" || hc === "Yes" || hc === true || hc === "1" || hc === 1 || String(hc).toLowerCase().trim() === "yes";

                  setScreeningStatus(prev => ({
                    guest1: isDone(data.guest1_hc) ? "complete" : "pending",
                    guest2: data.total_guests === 2 ? (isDone(data.guest2_hc) ? "complete" : "pending") : "not_required"
                  }));
                }
              } catch (err) {
                console.error("Status fetch failed", err);
              }
            };
            
            fetchStatus();
            
            const pollInterval = setInterval(fetchStatus, 5000);
            return () => clearInterval(pollInterval);
          }, [bookingMeta.bookingId]);



          const t = (key, data = {}) => {
            let text = TRANSLATIONS[lang]?.[key] || TRANSLATIONS.en[key] || key;
            Object.keys(data).forEach((placeholder) => {
              text = text.replace(`{${placeholder}}`, data[placeholder]);
            });
            return text;
          };

          const [isSwitchingLang, setIsSwitchingLang] = useState(false);

          const switchLanguage = async (newLang) => {
            if (newLang === route.lang) return;
            setIsSwitchingLang(true);
            try {
              if (window.__fetchRetreats) {
                await window.__fetchRetreats(newLang);
              }
              
              if (RETREATS.length > 0) {
                const newDefaultRetreat = RETREATS.find((retreat) =>
                  (Array.isArray(retreat.dates) ? retreat.dates : []).some(isRetreatDateAvailable)
                );
                if (!newDefaultRetreat) {
                  setRoute({ step: "config", lang: newLang });
                  return;
                }
                const newDefaultDate = newDefaultRetreat.dates.find(isRetreatDateAvailable);
                const newRoomsForRetreat = getRoomsForRetreat(newDefaultRetreat.id);
                const newDefaultRoomId = newRoomsForRetreat[0]?.id || null;
                const newTransport = getTransportOptionsForRetreat(newDefaultRetreat.id)[0]?.id ?? null;

                setSelection((prev) => ({
                  ...prev,
                  retreatId: newDefaultRetreat.id,
                  retreatName: newDefaultRetreat.name,
                  retreatLocation: newDefaultRetreat.location,
                  retreatEarlyBirdNote: newDefaultRetreat.earlyBirdNote,
                  retreatImage: newDefaultRetreat.image,
                  date: newDefaultDate?.label || null,
                  roomType: newDefaultRoomId,
                  transfer: newTransport,
                }));
              }

              const safeStep = STEPS.includes(route.step) ? route.step : "config";
              setRoute({ step: safeStep, lang: newLang });
            } catch (e) {
              console.error("Language switch failed", e);
            } finally {
              setIsSwitchingLang(false);
            }
          };

          const syncRoute = (nextRoute) => {
            const safeStep = STEPS.includes(nextRoute.step) ? nextRoute.step : "config";
            setIsTransitioning(true);
            window.scrollTo({ top: 0, behavior: "smooth" });
            setTimeout(() => {
              setRoute({ step: safeStep, lang: nextRoute.lang || getInitialLang() });
              setIsTransitioning(false);
            }, 400);
          };

          useEffect(() => {
            window.scrollTo({ top: 0, behavior: "smooth" });
          }, [route]);

          useEffect(() => {
            setScreeningStatus((prev) => {
              if (selection.guests === 1 && prev.guest2 !== "not_required") {
                return { ...prev, guest2: "not_required" };
              }
              if (selection.guests === 2 && prev.guest2 === "not_required") {
                return { ...prev, guest2: "pending" };
              }
              return prev;
            });
          }, [selection.guests]);

          const goToStep = (nextStep, replace = false) => {
            let targetStep = STEPS.includes(nextStep) ? nextStep : "config";
            
            // If we have a recovery bookingId, don't allow going back to pre-payment steps
            if (bookingMeta.bookingId) {
                const prePaymentSteps = ["config", "details", "review", "health_check"];
                if (prePaymentSteps.includes(targetStep)) {
                    targetStep = "payment";
                }
            }

            if (targetStep === "payment" && !safetyCleared && !bookingMeta.bookingId) {
              targetStep = "health_check";
            }
            const postPaymentSteps = ["screening", "review_state", "confirmed"];
            if (postPaymentSteps.includes(targetStep) && !depositPaid) {
              targetStep = "payment";
            }
            syncRoute({ ...route, step: targetStep }, replace);
          };

          useEffect(() => {
            const postPaymentSteps = ["screening", "review_state", "confirmed"];
            if (postPaymentSteps.includes(flowStep) && !depositPaid) {
              goToStep("payment", true);
            }
          }, [flowStep, depositPaid]);



          const dateOptions = useMemo(() => {
            const rawDates = RETREATS.flatMap((retreat) =>
              (Array.isArray(retreat.dates) ? retreat.dates : []).map((date) => ({
                ...date,
                retreatId: retreat.id,
                retreatName: retreat.name,
                location: retreat.location,
                image: retreat.image,
                earlyBirdNote: retreat.earlyBirdNote,
                promotion: retreat.promotion,
              })),
            );

            const now = new Date();
            now.setHours(0, 0, 0, 0);
            return rawDates
              .map((date) => {
                const startDate = parseRetreatStartDate(date.start);
                const earlyBirdDeadline = date.earlyBirdDeadline ? parseRetreatStartDate(date.earlyBirdDeadline) : null;
                const isEarlyBirdActive = earlyBirdDeadline ? now <= earlyBirdDeadline : false;
                return {
                  ...date,
                  startDate,
                  isEarlyBirdActive,
                };
              })
              .filter((date) => date.startDate && date.startDate >= now)
              .sort((a, b) => a.startDate - b.startDate);
          }, [route.lang]);

          const hasValidDateSelection = dateOptions.some(
            (date) => date.retreatId === selection.retreatId && date.label === selection.date,
          );

          useEffect(() => {
            if (recoveryLoading || bookingMeta.bookingId || hasValidDateSelection) return;
            // Stay within the retreat the guest arrived for; it is the only one listed.
            const requestedRetreat = getRequestedBookingRetreat(new URLSearchParams(window.location.search || ""));
            const fallbackDates = requestedRetreat
              ? dateOptions.filter((date) => date.retreatId === requestedRetreat.id)
              : dateOptions;
            const fallbackDate =
              fallbackDates.find((date) => date.retreatId === selection.retreatId) || fallbackDates[0];
            if (!fallbackDate) {
              setSelection((prev) => ({
                ...prev,
                retreatId: 0,
                retreatName: "",
                retreatLocation: "",
                retreatEarlyBirdNote: "",
                retreatImage: FALLBACK_IMAGE,
                date: "",
                roomType: null,
                transfer: null,
              }));
              return;
            }
            const fallbackRetreat = RETREATS.find((retreat) => retreat.id === fallbackDate.retreatId);
            const roomsForFallback = getRoomsForRetreat(fallbackDate.retreatId);
            setSelection((prev) => ({
              ...prev,
              retreatId: fallbackDate.retreatId,
              retreatName: fallbackDate.retreatName,
              retreatLocation: fallbackDate.location,
              retreatEarlyBirdNote: fallbackDate.earlyBirdNote,
              retreatImage: fallbackDate.image || fallbackRetreat?.image || FALLBACK_IMAGE,
              date: fallbackDate.label,
              roomType: prev.retreatId === fallbackDate.retreatId ? prev.roomType : roomsForFallback[0]?.id || null,
              transfer:
                prev.retreatId === fallbackDate.retreatId
                  ? prev.transfer
                  : (getTransportOptionsForRetreat(fallbackDate.retreatId)[0]?.id ?? null),
            }));
          }, [dateOptions, hasValidDateSelection, recoveryLoading, bookingMeta.bookingId, selection.retreatId]);

          const roomsForCurrentRetreat = useMemo(() => getRoomsForRetreat(selection.retreatId), [selection.retreatId, route.lang]);
          const filteredRoomsForCurrentRetreat = useMemo(() => {
            if (!Array.isArray(roomsForCurrentRetreat) || roomsForCurrentRetreat.length === 0) return [];
            const desired = selection.guests === 1 ? "single" : "shared";
            return roomsForCurrentRetreat.filter((room) => {
              const roomPerson = Number(room.person);
              if (Number.isFinite(roomPerson) && roomPerson > 0) {
                return roomPerson === selection.guests;
              }
              const typeHint = `${room.type || ""} ${room.name || ""}`.toLowerCase();
              if (desired === "single") return typeHint.includes("single");
              if (desired === "shared") return typeHint.includes("shared");
              return true;
            });
          }, [roomsForCurrentRetreat, selection.guests]);
          const transportOptionsForCurrentRetreat = useMemo(() => getTransportOptionsForRetreat(selection.retreatId), [selection.retreatId]);

          const pricing = useMemo(() => {
            const roomOptions = filteredRoomsForCurrentRetreat.length ? filteredRoomsForCurrentRetreat : roomsForCurrentRetreat;
            const room = roomOptions.find((r) => r.id === selection.roomType) || roomOptions[0];
            const roomPrice = room ? room.price : 0;
            const transportOption =
              transportOptionsForCurrentRetreat.find((option) => option.id === selection.transfer) || transportOptionsForCurrentRetreat[0];
            const subtotal = roomPrice;
            const selectedDate = dateOptions.find(
              (date) => date.retreatId === selection.retreatId && date.label === selection.date,
            );
            const promotion = selectedDate?.promotion || {};
            const guestCount = Number(selection.guests) || 0;
            const isEarlyBirdEligible = !!selectedDate?.isEarlyBirdActive;
            const isFriendPromotionEligible = guestCount === 2 && Number(promotion.friend?.value) > 0;
            const rawEarlyBird = isEarlyBirdEligible
              ? calculateConfiguredDiscount(subtotal, promotion.earlyBird, guestCount)
              : 0;
            const earlyBird = rawEarlyBird;
            const friendBase = subtotal - earlyBird;
            const rawFriend = isFriendPromotionEligible
              ? calculateConfiguredDiscount(friendBase, promotion.friend)
              : 0;
            const friend = rawFriend;
            const promotionTotal = earlyBird + friend;
            const transport = transportOption?.price || 0;
            const total = subtotal - promotionTotal + transport;
            const deposit = Math.round(total * 0.3);
            const remaining = total - deposit;
            return {
              subtotal,
              earlyBird,
              friend,
              promotionTotal,
              transport,
              total,
              deposit,
              remaining,
              earlyBirdConfig: promotion.earlyBird,
              friendConfig: promotion.friend,
            };
          }, [selection, dateOptions, roomsForCurrentRetreat, filteredRoomsForCurrentRetreat, transportOptionsForCurrentRetreat]);

          const stripeFee = paymentMethod === "stripe" ? Math.round(pricing.deposit * STRIPE_FEE_RATE) : 0;
          const paymentDueNow = pricing.deposit + stripeFee;
          const screeningsComplete = screeningStatus.guest1 === "complete" && 
                                     (selection.guests === 1 || screeningStatus.guest2 === "complete") &&
                                     (bookingStatus === "Payment received" || bookingStatus === "Deposit received");
          const safetyAllAnswered = Object.values(safetyAnswers).every((value) => value === "yes" || value === "no");
          const safetyHasConcern = Object.values(safetyAnswers).some((value) => value === "yes");
          const safetyCleared = safetyAllAnswered && !safetyHasConcern;

          const updateSelection = (updates) => setSelection((prev) => ({ ...prev, ...updates }));

          const roomOptionsForSummary = filteredRoomsForCurrentRetreat.length ? filteredRoomsForCurrentRetreat : roomsForCurrentRetreat;
          const selectedRoomForSummary = roomOptionsForSummary.find((r) => r.id === selection.roomType) || roomOptionsForSummary[0];
          const selectedRoomName = selectedRoomForSummary?.name || selectedRoomForSummary?.type || "";

          useEffect(() => {
            if (recoveryLoading) return;
            if (filteredRoomsForCurrentRetreat.length === 0) return;
            const hasSelected = filteredRoomsForCurrentRetreat.some((room) => room.id === selection.roomType);
            if (!hasSelected) {
              setSelection((prev) => ({ ...prev, roomType: filteredRoomsForCurrentRetreat[0].id }));
            }
          }, [filteredRoomsForCurrentRetreat, selection.roomType, recoveryLoading]);

          const updateGuest = (guestKey, field, value) => {
            setGuestDetails((prev) => ({
              ...prev,
              [guestKey]: { ...prev[guestKey], [field]: value },
            }));
          };

          const updateSafetyAnswer = (questionId, value) => {
            setSafetyAnswers((prev) => ({ ...prev, [questionId]: value }));
          };

          // Until a phone country is chosen by hand, it follows the country of residence.
          const handlePrimaryCountryChange = (value) => {
            setGuestDetails((prev) => {
              const next = { ...prev, guest1: { ...prev.guest1, country: value } };
              const iso = findCountryIso(value);
              if (iso) {
                ["guest1", "guest2"].forEach((guestKey) => {
                  if (!next[guestKey].phoneCodeManuallySet) {
                    next[guestKey] = { ...next[guestKey], phoneCountry: iso, phoneCountryCode: getDialCode(iso) };
                  }
                });
              }
              return next;
            });
          };

          // Guest 2's phone country follows guest 1's until it is changed separately.
          const updateGuestPhoneCountry = (guestKey, iso) => {
            setGuestDetails((prev) => {
              const next = { ...prev, [guestKey]: { ...prev[guestKey], phoneCountry: iso, phoneCountryCode: getDialCode(iso), phoneCodeManuallySet: true } };
              if (guestKey === "guest1" && !prev.guest2.phoneCodeManuallySet) {
                next.guest2 = { ...prev.guest2, phoneCountry: iso, phoneCountryCode: getDialCode(iso) };
              }
              return next;
            });
          };

          const normalizeGuestPhone = (guestKey) => {
            setGuestDetails((prev) => {
              const guest = withSplitPhone(prev[guestKey]);
              return guest === prev[guestKey] ? prev : { ...prev, [guestKey]: guest };
            });
          };

          const handleRetreatSelection = (dateOption) => {
            if (!dateOption) return;
            setSelection((prev) => {
              const isSameRetreat = prev.retreatId === dateOption.retreatId;
              const roomsForSelectedRetreat = getRoomsForRetreat(dateOption.retreatId);
              return {
                ...prev,
                retreatId: dateOption.retreatId,
                retreatName: dateOption.retreatName,
                retreatLocation: dateOption.location,
                retreatEarlyBirdNote: dateOption.earlyBirdNote,
                retreatImage: dateOption.image,
                date: dateOption.label,
                roomType: isSameRetreat ? prev.roomType : roomsForSelectedRetreat[0]?.id || null,
                transfer: isSameRetreat ? prev.transfer : (getTransportOptionsForRetreat(dateOption.retreatId)[0]?.id ?? null),
              };
            });
          };

          const openGallery = (room) => {
            setGalleryRoom(room);
            setGalleryIndex(0);
          };

          const closeGallery = () => {
            setGalleryRoom(null);
            setGalleryIndex(0);
          };

          const showNextImage = () => {
            if (!galleryRoom) return;
            setGalleryIndex((index) => (index + 1) % galleryRoom.images.length);
          };

          const showPrevImage = () => {
            if (!galleryRoom) return;
            setGalleryIndex((index) => (index - 1 + galleryRoom.images.length) % galleryRoom.images.length);
          };

          useEffect(() => {
            if (!galleryRoom) return undefined;
            const previousFocus = document.activeElement;
            const body = document.body;
            const originalOverflow = body.style.overflow;
            const originalPaddingRight = body.style.paddingRight;

            // To prevent layout shift when scrollbar disappears
            const scrollBarWidth = window.innerWidth - document.documentElement.clientWidth;

            body.style.overflow = "hidden";
            if (scrollBarWidth > 0) {
              body.style.paddingRight = `${scrollBarWidth}px`;
            }

            const handleKeyDown = (event) => {
              if (event.key === "Escape") {
                event.preventDefault();
                closeGallery();
                return;
              }
              if (event.key === "Tab") {
                const focusableSelectors = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
                const nodes = modalRef.current?.querySelectorAll(focusableSelectors);
                const focusable = nodes ? Array.from(nodes).filter((node) => !node.hasAttribute("disabled")) : [];
                if (focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (event.shiftKey) {
                  if (document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                  }
                } else if (document.activeElement === last) {
                  event.preventDefault();
                  first.focus();
                }
              }
            };

            document.addEventListener("keydown", handleKeyDown);
            requestAnimationFrame(() => closeButtonRef.current?.focus());

            return () => {
              document.removeEventListener("keydown", handleKeyDown);
              body.style.overflow = originalOverflow;
              body.style.paddingRight = originalPaddingRight;
              previousFocus?.focus?.();
            };
          }, [galleryRoom]);

          const guestDetailsValid = () => {
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const g1 = guestDetails.guest1;
            const primaryFieldsFilled =
              g1.firstName.trim() &&
              (bookingMeta.bookingId || ["male", "female"].includes(g1.gender)) &&
              g1.lastName.trim() &&
              g1.email.trim() &&
              emailPattern.test(g1.email.trim()) &&
              g1.phone.trim() &&
              g1.street.trim() &&
              g1.city.trim() &&
              g1.postalCode.trim() &&
              g1.country.trim();
            const companyValid = !g1.needsCompanyInvoice || (
              g1.companyName.trim() &&
              g1.taxId.trim() &&
              g1.companyPhone?.trim() &&
              g1.companyAddress?.trim()
            );
            if (!primaryFieldsFilled || !companyValid) return false;
            if (selection.guests === 1) return true;

            const g2 = guestDetails.guest2;
            const g2Valid =
              g2.firstName.trim() &&
              (bookingMeta.bookingId || ["male", "female"].includes(g2.gender)) &&
              g2.lastName.trim() &&
              g2.email.trim() &&
              emailPattern.test(g2.email.trim()) &&
              g2.email.trim().toLowerCase() !== g1.email.trim().toLowerCase() &&
              g2.phone.trim();
            return g2Valid;
          };

          const buildBookingPayload = () => {
            const selectedDate = dateOptions.find(
              (date) => date.retreatId === selection.retreatId && date.label === selection.date,
            );
            const selectedRoom = roomsForCurrentRetreat.find((room) => room.id === selection.roomType) || roomsForCurrentRetreat[0] || null;
            const selectedTransport =
              transportOptionsForCurrentRetreat.find((option) => option.id === selection.transfer) || transportOptionsForCurrentRetreat[0] || null;
            const purchaseFirstName = guestDetails.guest1.firstName?.trim() || "";
            const purchaseLastName = guestDetails.guest1.lastName?.trim() || "";
            const purchaseEmail = guestDetails.guest1.email?.trim() || "";
            const purchasePhone = formatPhoneWithCountry(guestDetails.guest1);
            const packageType = selectedRoom?.type || selectedRoom?.roomType || "";
            const transportType = selectedTransport?.label ?? selectedTransport?.id ?? "";
            return {
              lang: lang,
              retreat_id: selection.retreatId,
              retreat_name: selection.retreatName,
              location: selection.retreatLocation,
              total_persons: selection.guests,
              purchase_first_name: purchaseFirstName,
              purchase_last_name: purchaseLastName,
              purchase_email: purchaseEmail,
              purchase_phone: purchasePhone,
              start_date: selectedDate?.start || "",
              end_date: selectedDate?.end || "",
              package_sku: selectedRoom?.sku || "",
              package_type: packageType,
              package_price: selectedRoom?.price || 0,
              transportation_type: transportType,
              transportation_fee: selectedTransport?.price || 0,
              total: pricing.total,
              join_with_a_friend: selection.guests === 2 ? "yes" : "",
              retreat: {
                id: selection.retreatId,
                name: selection.retreatName,
                location: selection.retreatLocation,
                earlyBirdNote: selection.retreatEarlyBirdNote,
                image: selection.retreatImage,
              },
              date: selectedDate
                ? {
                    label: selectedDate.label,
                    start: selectedDate.start,
                    end: selectedDate.end,
                    earlyBirdDeadline: selectedDate.earlyBirdDeadline || null,
                    limited: !!selectedDate.limited,
                    isEarlyBirdActive: !!selectedDate.isEarlyBirdActive,
                  }
                : null,
              guests: selection.guests,
              room: selectedRoom
                ? {
                    id: selectedRoom.id,
                    sku: selectedRoom.sku || null,
                    name: selectedRoom.name,
                    type: selectedRoom.type || null,
                    person: selectedRoom.person || null,
                    price: selectedRoom.price || 0,
                    roomType: selectedRoom.roomType || null,
                  }
                : null,
              transport: selectedTransport ? { id: selectedTransport.id, label: selectedTransport.label, price: selectedTransport.price || 0 } : null,
              guestDetails: emailGuestDetails,
              pricing: {
                subtotal: pricing.subtotal,
                earlyBird: pricing.earlyBird,
                friend: pricing.friend,
                transport: pricing.transport,
                total: pricing.total,
                deposit: pricing.deposit,
                remaining: pricing.remaining,
                stripeFee,
                paymentDueNow,
              },
              paymentMethod,
              screeningStatus,
              safetyAnswers,
              submittedAt: new Date().toISOString(),
            };
          };

          const handlePayment = async () => {
            if (paymentSubmitting) return;
            if (!bookingMeta.bookingId && !guestDetailsValid()) {
              goToStep("details");
              return;
            }
            setPaymentError("");
            setPaymentSubmitting(true);
            try {
              let bookingId = bookingMeta.bookingId;
              let customerIds = bookingMeta.customerIds;

              if (!bookingId) {
                const payload = buildBookingPayload();
                const response = await fetch(BOOKING_API_ENDPOINT, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(payload),
                });
                if (!response.ok) {
                  throw new Error(`HTTP ${response.status}`);
                }
                const responseBody = await response.json();
                bookingId = responseBody?.booking_id;
                customerIds = Array.isArray(responseBody?.customer_ids) ? responseBody.customer_ids : [];
                
                setBookingMeta({
                  bookingId: bookingId ?? null,
                  customerIds: customerIds,
                });
              }

              // If OnePay, redirect to OnePay URL generator
              if (paymentMethod === "onepay_domestic" || paymentMethod === "onepay_intl") {
                const returnPath = getBookingReturnPath(lang);
                const urlResponse = await fetch("/wp-json/retreats/v1/onepay-url", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ 
                    booking_id: bookingId, 
                    payment_type: paymentMethod,
                    lang: lang,
                    return_base: returnPath
                  }),
                });
                if (!urlResponse.ok) throw new Error("Failed to generate OnePay URL");
                const urlData = await urlResponse.json();
                if (urlData.return_path !== returnPath) {
                  throw new Error(
                    `OnePay return path mismatch: expected ${returnPath}, received ${urlData.return_path || "none"}`
                  );
                }
                if (urlData.payment_url) {
                  try {
                    sessionStorage.setItem("vdx_booking_state", JSON.stringify({
                      selection,
                      guestDetails: emailGuestDetails,
                      paymentMethod,
                      bookingMeta: {
                        bookingId: bookingId ?? null,
                        customerIds: customerIds,
                      },
                      screeningStatus
                    }));
                  } catch(e) {}
                  window.location.href = urlData.payment_url;
                  return;
                }
              }

              setPaymentSuccess(true);
              if (!depositPaid) {
                setDepositPaid(true);
                setScreeningStatus((prev) => ({
                  guest1: prev.guest1 === "complete" ? "complete" : "pending",
                  guest2: selection.guests === 2 ? (prev.guest2 === "complete" ? "complete" : "pending") : "not_required",
                }));
              }
              setTimeout(() => goToStep("screening"), 2000);
            } catch (error) {
              console.error("Failed to submit booking payload", error);
              setPaymentError("We could not secure your booking right now. Please try again.");
            } finally {
              setPaymentSubmitting(false);
            }
          };

          const renderConfigStep = () => (
            <div className="space-y-12">
              <header className="space-y-3">
                <p className="text-[12px] uppercase tracking-[0.4em] text-stone-400">{t("step")} 1</p>
                <h1 className="text-4xl font-bold">{t("plan_journey")}</h1>
                <p className="text-stone-500">
                  {t("plan_description")}
                </p>
              </header>

              <section className="space-y-4">
                <div>
                  <p className="text-xs uppercase tracking-[0.3em] text-stone-400 font-semibold">{t("upcoming_retreats")}</p>
                  <p className="text-sm text-stone-500">{t("retreats_description")}</p>
                </div>
                <div className="space-y-4">
                  {getBookingRetreats().map((retreat) => {
                    const retreatDates = dateOptions.filter((option) => option.retreatId === retreat.id);
                    const isActiveRetreat = selection.retreatId === retreat.id;
                    const preferredDate =
                      retreatDates.find((date) => selection.retreatId === retreat.id && date.label === selection.date) || retreatDates[0];
                    return (
                      <div key={retreat.id} className={`space-y-3 border rounded-3xl p-4 md:p-6 transition-all duration-300 ${isActiveRetreat ? "border-2 border-emerald-600 bg-emerald-50 shadow-md" : "border-stone-100 bg-white shadow-sm"}`}>
                        <div
                          className={`flex flex-col md:flex-row md:items-center gap-4 ${preferredDate ? "cursor-pointer" : "cursor-default"}`}
                          role="button"
                          aria-pressed={isActiveRetreat}
                          aria-disabled={!preferredDate}
                          tabIndex={preferredDate ? 0 : -1}
                          onClick={() => preferredDate && handleRetreatSelection(preferredDate)}
                          onKeyDown={(event) => {
                            if (event.key === "Enter" || event.key === " ") {
                              event.preventDefault();
                              preferredDate && handleRetreatSelection(preferredDate);
                            }
                          }}
                        >
                          <div className="flex-shrink-0 w-full md:w-52">
                            <div className="relative h-32 w-full overflow-hidden rounded-2xl">
                              <img
                                src={retreat.image || FALLBACK_IMAGE}
                                alt={retreat.name}
                                className="w-full h-full object-cover"
                                onError={handleImageError}
                              />
                              <div className="absolute inset-0 bg-gradient-to-t from-stone-900/20 to-transparent pointer-events-none" />
                            </div>
                          </div>
                          <div className="flex-1 min-w-0 space-y-2">
                            <p className="text-xs uppercase tracking-[0.2em] text-stone-400">{retreat.location}</p>
                            <div className="flex items-start justify-between gap-3">
                              <h3 className="vdx-retreat-name">{retreat.name}</h3>
                              <span
                                className={`mt-1 w-6 h-6 rounded-full border flex items-center justify-center text-[10px] font-semibold ${
                                  isActiveRetreat ? "border-emerald-600 bg-emerald-600 text-white" : "border-stone-200 text-stone-300"
                                }`}
                              >
                                {isActiveRetreat ? <Icons.Check /> : null}
                              </span>
                            </div>
                            <p className="text-sm text-stone-500 line-clamp-2 md:line-clamp-none">{retreat.description}</p>
                            <div className="flex items-center gap-2 pt-1">
                              <a 
                                href={retreat.url} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                onClick={(e) => e.stopPropagation()}
                                className="text-xs font-semibold text-emerald-700 hover:text-emerald-800 underline underline-offset-4 flex items-center gap-1 group"
                              >
                                {t("read_more")}
                                <svg className="w-3 h-3 transition-transform group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                              </a>
                            </div>
                            <p className="text-xs text-stone-500">{retreat.earlyBirdNote}</p>
                          </div>
                        </div>
                        <div className="space-y-2">
                          <p className="text-xs uppercase tracking-[0.3em] text-stone-400">{t("available_dates")}</p>
                          <div className="flex items-center gap-2">
                            {retreatDates.length > 2 && (
                              <button
                                type="button"
                                aria-label="Show earlier retreat dates"
                                className="vdx-date-arrow hidden md:inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full border"
                                onClick={(event) => {
                                  event.stopPropagation();
                                  const container = event.currentTarget.nextSibling;
                                  container?.scrollBy({ left: -220, behavior: "smooth" });
                                }}
                              >
                                <Icons.ChevronLeft />
                              </button>
                            )}
                            <div className="flex gap-2 overflow-x-auto hide-scrollbar py-2 px-2 flex-1" onWheel={(event) => event.stopPropagation()}>
                              {retreatDates.length === 0 && (
                                <p className="py-2 text-sm text-stone-500">{t("no_upcoming_dates")}</p>
                              )}
                              {retreatDates.map((dateOption) => {
                                const activeDate = selection.date === dateOption.label;
                                const showEarlyBird = dateOption.isEarlyBirdActive;
                                const showLimited = dateOption.limited;
                                return (
                                  <button
                                    key={dateOption.label}
                                    type="button"
                                    aria-label={`Select ${dateOption.label}`}
                                    aria-pressed={activeDate}
                                    onClick={(event) => {
                                      event.stopPropagation();
                                      handleRetreatSelection(dateOption);
                                    }}
                                    className={`vdx-date-button flex-shrink-0 px-3 py-2 text-xs md:text-sm rounded-full border transition-all duration-200 ${
                                      activeDate ? "bg-emerald-800 text-white border-emerald-800 scale-[1.05] shadow-md" : "border-stone-200 text-stone-600 hover:border-emerald-200 bg-white"
                                    }`}
                                  >
                                    <span className={`font-semibold whitespace-nowrap ${activeDate ? "text-white" : "text-stone-900"}`}>{dateOption.label}</span>
                                    {(showEarlyBird || showLimited) && (
                                      <div className="flex flex-wrap gap-1 mt-1 justify-center">
                                        {showEarlyBird && (
                                          <span className={`text-[10px] font-semibold uppercase tracking-[0.2em] ${activeDate ? "text-emerald-100" : "text-emerald-700"}`}>
                                            {t("early_bird_label").replace("{{discount}}", formatConfiguredDiscount(dateOption.promotion?.earlyBird, lang))}
                                          </span>
                                        )}
                                        {showLimited && (
                                          <span className={`text-[10px] font-semibold uppercase tracking-[0.2em] ${activeDate ? "text-amber-200" : "text-amber-700"}`}>
                                            {t("limited_spots")}
                                          </span>
                                        )}
                                      </div>
                                    )}
                                  </button>
                                );
                              })}
                            </div>
                            {retreatDates.length > 2 && (
                              <button
                                type="button"
                                aria-label="Show later retreat dates"
                                className="vdx-date-arrow hidden md:inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full border"
                                onClick={(event) => {
                                  event.stopPropagation();
                                  const container = event.currentTarget.previousSibling;
                                  container?.scrollBy({ left: 220, behavior: "smooth" });
                                }}
                              >
                                <Icons.ChevronRight />
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>

              <section className="space-y-4">
                <p className="text-xs uppercase tracking-[0.3em] text-stone-400 font-semibold">{t("guests")}</p>
                <div className="flex flex-col md:flex-row gap-4">
                  {[1, 2].map((count) => {
                    const active = selection.guests === count;
                    return (
                      <button
                        key={count}
                        type="button"
                        aria-pressed={active}
                        onClick={() => updateSelection({ guests: count })}
                        className={`flex-1 border-2 rounded-2xl p-4 flex items-center justify-between transition-all duration-200 ${
                          active ? "border-2 border-emerald-600 bg-emerald-50 ring-4 ring-emerald-600/10 shadow-lg" : "border-stone-100 hover:border-stone-200"
                        }`}
                      >
                        <div className="text-left">
                          <p className="font-semibold">{count === 1 ? t("one_guest") : t("two_guests")}</p>
                          <p className="text-sm text-stone-500">
                            {count === 2
                              ? t("save_together").replace(
                                  "{{discount}}",
                                  formatConfiguredDiscount(
                                    RETREATS.find((retreat) => retreat.id === selection.retreatId)?.promotion?.friend,
                                    lang,
                                  ),
                                )
                              : t("private_journey")}
                          </p>
                        </div>
                        {count === 2 ? <Icons.Users /> : <Icons.User />}
                      </button>
                    );
                  })}
                </div>

                <span className="font-bold text-blue-500">G</span> Pay

              <span className="inline-flex items-center justify-center whitespace-nowrap h-9 px-3 py-1.5 bg-[#1428A0] text-white text-sm font-bold rounded-md leading-tight shadow-sm">Samsung Pay</span>

                <span className="text-xl font-extrabold italic text-blue-700 tracking-tight leading-tight">QR</span>
